<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissor</title>

</head>
<body>


    <button onclick="playGame('Rock')">Rock</button>
    <button onclick="playGame('Paper')">Paper</button>
    <button onclick="playGame('Scissor')">Scissor</button>




    <script>
        function playGame(playMove) {
            const randomNumber = Math.random();
            let computerMove = '';
   
            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerMove = 'Rock';
            } else if (randomNumber >= 1 / 3 && randomNumber <= 2 / 3) {
                computerMove = 'Paper';
            } else {
                computerMove = 'Scissor';
            }
            let result = '';

            if (playMove === computerMove) {
                result = 'Tie';
            } else if (
                (playMove === 'Rock' && computerMove === 'Scissor') ||
                (playMove === 'Papar' && computerMove === 'Rock') ||
                (playMove === 'Scissor' && computerMove === 'Papar')
            ) {
                result = 'You Win';
            } else {
                result = 'You Lose';
            }
            alert(`You picked ${playMove}. Computer picked ${computerMove}. ${result}`);
            console.log(computerMove);
        }

    </script>
</body>
</html>
